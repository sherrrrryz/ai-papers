<!doctype html>
<html lang="en">
<head>

  <title>Paper Analysis</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="page-header">
    <a class="back" href="index.html">&larr; All papers</a>

    <p class="authors" id="authors"></p>

  <main>
    <div id="hl-bar" class="hl-bar" hidden>

  <div id="hl-popup" class="hl-popup" hidden></div>
